    <title>nothing to exist</title>
    <style>
        body{
            background-color: #1b1b1b;
            font-family: 'Courier New', Courier, monospace;
            color: #d9d9d9;
        }

        a, a:visited{
            color:aquamarine;
        }

        img{
            height:75px;
            width:75px;
            cursor: pointer;
        }
        
        .container{
            width:100%;
            height:100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .content{
            width:400px;
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="content">
            <img id="gif" src="1.png">
            <!-- <p>nothing to exist</p> -->
            <p>Nothing to Exist is an independent label from New York City focusing on physical presses of music.<br><br>
                ~
                <br><br>
    
                <a href="../nothingtoexist/releases/nte-001.html" title="NTE-001">NTE-001</a>, <a href="https://www.instagram.com/volenaband/" target="_blank" title="Volena's Instagram">Volena</a>'s debut EP, will be released April 4, 2025. You can <a href="https://volena.bandcamp.com/track/groceries-2" target="_blank" title="Volena's Bandcamp">pre-order it here</a>.
            </p>
        </div>
    </div>
    

    <script>
        
        const imageElement = document.getElementById('gif');

        // Define the URLs of the images you want to toggle between
        const firstImage = 'star-gif.gif'; // The image to display on click
        const secondImage = '1.png'; // The image to display after a few seconds

        // Define the delay in milliseconds
        const delay = 1200; // 2 seconds

        // Add an event listener for click events on the image
        imageElement.addEventListener('mouseover', () => {
        // Change the image source on click
        imageElement.src = firstImage;

        // Change the image source back after the specified delay
        setTimeout(() => {
            imageElement.src = secondImage;
        }, delay);
    });


    </script>
</body>
